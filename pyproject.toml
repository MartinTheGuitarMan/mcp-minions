[project]
name = "mcp-minions"
version = "0.3.0"
description = "MCP server that delegates narrow tasks (classify, extract, summarize) to local models via Ollama and LM Studio."
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "httpx>=0.27", "jsonschema>=4.20",
                "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
mcp-minions = "minions.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minions"]
